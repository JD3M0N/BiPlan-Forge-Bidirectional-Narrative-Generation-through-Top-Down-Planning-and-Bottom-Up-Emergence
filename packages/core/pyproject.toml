[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asg-core"
version = "0.9.0"
description = "Shared infrastructure for the ASG monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.8,<4", "edge-tts>=7.2.8,<8", "langdetect>=1.0.9,<2"]

[project.scripts]
asg = "asg_core.help:main"
asg-latex = "asg_core.latex:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asg_core"]
