[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asg-top-down"
version = "5.1.0"
description = "Modular Top-Down automatic story generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asg-core>=0.1.0",
  "asg-evaluation>=0.2.0",
  "google-genai>=1.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.scripts]
generate-story = "asg_top_down.cli:main"
compare-story-runs = "asg_top_down.compare:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asg_top_down"]
