[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asg-stagecraft"
dynamic = ["version"]
description = "Hybrid automatic story generation: top-down planning, bottom-up performance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asg-core>=0.7.0",
  "asg-evaluation>=2.0.0",
  "google-genai>=1.0,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
asg-features = "asg_stagecraft.tools.extract_features:main"
asg-baseline = "asg_stagecraft.tools.baseline:main"
asg-generate = "asg_stagecraft.tools.generate:main"
asg-recover = "asg_stagecraft.tools.recovery:main"
asg-budget = "asg_stagecraft.tools.budget:main"
asg-recompute = "asg_stagecraft.tools.recompute:main"

[tool.hatch.version]
path = "src/asg_stagecraft/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/asg_stagecraft"]
