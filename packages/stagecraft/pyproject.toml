[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asg-stagecraft"
dynamic = ["version"]
description = "Hybrid automatic story generation: top-down planning, bottom-up performance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asg-core>=0.6.0",
  "asg-evaluation>=0.7.0",
  "google-genai>=1.0,<2",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
generate-story = "asg_stagecraft.tools.generate:main"
compare-story-runs = "asg_stagecraft.tools.compare:main"
recover-story-runs = "asg_stagecraft.tools.recovery:main"
audit-stage-run = "asg_stagecraft.tools.audit_stage:main"
recompute-simulation-metrics = "asg_stagecraft.tools.recompute:main"

[tool.hatch.version]
path = "src/asg_stagecraft/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/asg_stagecraft"]
