name: Puerta de calidad

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: windows-latest
    steps:
      # The repository name is repeated in the default Windows workspace path.
      # Enable long paths before fetch creates pack files under .git/objects.
      - name: Enable long paths in Git
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            packages/*/pyproject.toml
            apps/*/pyproject.toml

      - name: Instalar el monorepo
        id: install
        run: python -m pip install -r requirements-dev.txt

      # Las cuatro comprobaciones corren aunque una falle, para que una vuelta de CI
      # enseñe todo el daño en vez de sólo el primer fallo.
      - name: ruff check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check .

      - name: ruff format --check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff format --check .

      # run-tests.ps1 es el único comando para los tests: local y en CI corren lo mismo.
      - name: run-tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: pwsh
        run: ./run-tests.ps1

      - name: pip check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pip check
