[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asg-evaluation"
version = "0.1.0"
description = "Evaluaciones humanas compartidas para historias ASG"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/asg_evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
