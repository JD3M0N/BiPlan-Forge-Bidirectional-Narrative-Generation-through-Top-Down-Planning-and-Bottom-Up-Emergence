[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asg-top-down"
version = "4.0.0"
description = "Sistema modular de generación automática de historias Top-Down"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asg-evaluation>=0.1.0",
  "google-genai>=1.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
generate-story = "asg_top_down.cli:main"
compare-story-runs = "asg_top_down.compare:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asg_top_down"]

[tool.hatch.build.targets.wheel.force-include]
"schema_db" = "asg_top_down/schema_db"

[tool.pytest.ini_options]
testpaths = ["tests"]
