[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asg-console"
version = "1.1.1"
description = "Interfaz de consola unificada para ASG Top-Down y Bottom-Up"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asg-evaluation>=0.1.0",
  "asg-top-down>=2.0.1",
  "asg-escape-room>=1.0.0",
  "asg-prompt-crafter>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
asg-console = "asg_console.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asg_console"]

[tool.pytest.ini_options]
testpaths = ["tests"]
