[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asg-console"
version = "2.0.0"
description = "Unified console for ASG Top-Down and Bottom-Up"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asg-core>=0.2.0",
  "asg-evaluation>=0.2.0",
  "asg-top-down>=6.0.0",
  "asg-escape-room>=1.2.0",
]

[project.scripts]
asg-console = "asg_console.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asg_console"]
