[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asg-console"
version = "3.0.0"
description = "Unified console for ASG Stagecraft generation and human evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asg-core>=0.5.0",
  "asg-evaluation>=0.2.0",
  "asg-stagecraft>=6.0.0",
]

[project.scripts]
asg-console = "asg_console.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asg_console"]
