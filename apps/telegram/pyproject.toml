[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asg-telegram"
version = "1.8.0"
description = "Telegram bot for generating and evaluating ASG stories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asg-core>=0.2.0",
  "asg-evaluation>=0.2.0",
  "asg-top-down>=5.4.0",
  "colorama>=0.4.6",
  "python-dotenv>=1.0",
  "python-telegram-bot>=22.6,<23",
]

[project.scripts]
asg-telegram = "asg_telegram.launcher:main"
asg-telegram-run = "asg_telegram.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asg_telegram"]
