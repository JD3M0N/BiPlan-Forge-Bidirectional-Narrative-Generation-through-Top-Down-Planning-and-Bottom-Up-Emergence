[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asg-studio"
version = "0.2.0"
description = "StageCraft: the graphical interface for Stagecraft generation and run comparison"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asg-core>=0.6.0",
  "asg-evaluation>=0.8.0",
  "asg-stagecraft>=7.4.0",
  "fastapi>=0.141,<1",
  "uvicorn>=0.54,<1",
  "pydantic>=2.9,<3",
]

[project.scripts]
asg-studio = "asg_studio.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asg_studio"]
