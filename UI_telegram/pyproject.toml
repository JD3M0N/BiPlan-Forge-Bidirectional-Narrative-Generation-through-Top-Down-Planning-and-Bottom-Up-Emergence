[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asg-telegram"
version = "1.4.0"
description = "Bot de Telegram para generar y evaluar historias ASG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asg-evaluation>=0.1.0",
  "asg-top-down>=4.0.0",
  "colorama>=0.4.6",
  "python-dotenv>=1.0",
  "python-telegram-bot>=22.6,<23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
asg-telegram = "asg_telegram.launcher:main"
asg-telegram-run = "asg_telegram.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asg_telegram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
